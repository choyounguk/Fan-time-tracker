<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Still Air · 선풍기 타이머 시안</title>
<style>
:root{--ink:#484b4d;--muted:#858a8d;--line:#e6e8e9;--shell:#f8f8f5;--shell-dark:#d4d5d2;--shell-mid:#eeeFEB;--speed:6s}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff;color:var(--ink)}body{font-family:Arial,'Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:2px solid #7d858b;outline-offset:6px}button:disabled{cursor:default;opacity:.25}main{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:32px 20px}.installation{width:min(440px,100%);display:flex;align-items:center;flex-direction:column;position:relative}.sculpture{width:300px;height:378px;position:relative;margin-bottom:19px}.sculpture svg{width:100%;height:100%;overflow:visible;position:relative;z-index:1}.floor{position:absolute;width:164px;height:13px;background:#777b7b;filter:blur(13px);opacity:.13;border-radius:50%;left:68px;bottom:6px;transform:scaleY(.65)}.object{transform-origin:150px 340px}.running[data-level="4"] .object{animation:tremble .105s infinite alternate}.running[data-level="3"] .object{animation:tremble .19s infinite alternate}.primary-actions{position:relative;display:flex;justify-content:center;align-items:center;width:100%;height:52px;flex-shrink:0;--power-offset:0px}.paused .primary-actions{--power-offset:-34px}.power{transform:translateX(var(--power-offset));border:1px solid #dce0e1;background:linear-gradient(145deg,#fff,#f6f7f7);width:52px;height:52px;border-radius:50%;display:grid;place-items:center;box-shadow:0 3px 6px #252e3505,inset 0 1px 1px white;transition:box-shadow .4s,background .4s,transform .65s cubic-bezier(.22,1,.36,1);color:#7b8184}.power:hover{box-shadow:0 4px 14px #252e3510}.power:active{transform:translateX(var(--power-offset)) scale(.94)}.running .power{background:#eef0ef;box-shadow:inset 0 2px 4px #2530350b;color:#40494d}.power svg{width:19px;height:19px}.readout{height:173px;width:100%;text-align:center;padding-top:27px;position:relative}.clock-wrap{opacity:0;filter:blur(7px);transform:translateY(10px);transition:opacity 1.1s .12s,filter 1.1s .12s,transform 1.1s .12s}.started .clock-wrap{opacity:1;filter:blur(0);transform:translateY(0)}.clock{font-family:'Helvetica Neue',Arial,sans-serif;font-size:47px;font-weight:200;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;line-height:1.15}.clock-fraction{display:inline-block;font-size:.49em;letter-spacing:-.5px;color:#92999c;min-width:1.7em;text-align:left;margin-left:3px}.clock-fraction[hidden]{display:none}.status{font-size:9px;letter-spacing:2.3px;color:#93999b;margin-top:8px;height:11px;text-transform:uppercase}.controls{display:flex;align-items:center;justify-content:center;gap:25px;margin-top:24px;opacity:0;transform:translateY(7px);transition:opacity .7s,transform .7s;visibility:hidden}.running .controls{opacity:1;transform:translateY(0);visibility:visible;transition-delay:.65s}.wind{display:flex;align-items:center;gap:12px}.step{background:linear-gradient(145deg,#fff,#f6f7f7);border:1px solid #dce0e1;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:300;padding:0;color:#70787c;box-shadow:0 2px 5px #252e3505,inset 0 1px 1px #fff;transition:transform .18s,box-shadow .3s,border-color .3s}.step:hover:not(:disabled){border-color:#b8c0c4;box-shadow:0 3px 10px #252e3510}.step:active:not(:disabled){transform:scale(.93)}.step:disabled{opacity:.45}.strength{min-width:31px;font-size:10px;letter-spacing:.5px}.divider{width:1px;height:15px;background:var(--line)}.colors{display:flex;gap:10px}.swatch{width:15px;height:15px;border-radius:50%;border:1px solid #0000000c;padding:0;background:var(--chip);position:relative}.swatch[aria-pressed="true"]:after{content:'';position:absolute;inset:-4px;border:1px solid #b8bec1;border-radius:50%}.reset{position:absolute;top:0;left:calc(50% + 8px);transform:translate(-10px,3px) scale(.94);width:52px;height:52px;border-radius:50%;border:1px solid #dce0e1;background:linear-gradient(145deg,#fff,#f6f7f7);display:grid;place-items:center;padding:0;color:#70787c;box-shadow:0 2px 5px #252e3505,inset 0 1px 1px #fff;opacity:0;filter:blur(3px);visibility:hidden;pointer-events:none;transition:opacity .28s ease,transform .42s cubic-bezier(.22,1,.36,1),filter .28s ease,visibility 0s .42s,box-shadow .3s}.reset svg{width:18px;height:18px}.reset:hover{border-color:#b8c0c4;box-shadow:0 3px 10px #252e3510}.paused .reset{opacity:1;filter:blur(0);transform:translate(0,0) scale(1);visibility:visible;pointer-events:auto;transition:opacity .65s ease .12s,transform .7s cubic-bezier(.22,1,.36,1) .12s,filter .65s ease .12s,visibility 0s,box-shadow .3s}.paused .reset:active{transform:scale(.94)}.quiet-note{height:15px;font-size:9px;color:#a0a5a7;margin-top:14px;letter-spacing:.3px;opacity:0;transition:opacity .5s}.running[data-level="4"] .quiet-note{opacity:1}.rotor{transform-origin:150px 127px}.shell-fill{fill:var(--shell);transition:fill .7s}.shell-dark{stop-color:var(--shell-dark);transition:stop-color .7s}.shell-light{stop-color:var(--shell);transition:stop-color .7s}.shell-mid{stop-color:var(--shell-mid);transition:stop-color .7s}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@keyframes tremble{from{transform:rotate(-.12deg)}to{transform:rotate(.12deg)}}@media(max-height:740px){main{padding:15px}.sculpture{width:255px;height:321px;margin-bottom:12px}.floor{left:57px;width:140px}.readout{height:160px;padding-top:22px}.clock{font-size:42px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition-duration:.01ms!important;transition-delay:0s!important}.clock-wrap{filter:none;transform:none}}
</style>
</head>
<body>
<main aria-label="선풍기 타이머"><section class="installation" data-level="1" aria-label="타이머 조작">
<div class="sculpture" role="img" aria-label="흰색 휴대용 선풍기 3D 스타일 오브제"><div class="floor"></div>
<svg viewBox="0 0 300 378" aria-hidden="true"><defs>
<linearGradient id="handle" x1="0" x2="1"><stop class="shell-dark"/><stop offset=".22" class="shell-light"/><stop offset=".48" stop-color="#fff"/><stop offset=".74" class="shell-mid"/><stop offset="1" class="shell-dark"/></linearGradient>
<radialGradient id="rim" cx=".36" cy=".22" r=".85"><stop stop-color="#fff"/><stop offset=".5" class="shell-light"/><stop offset=".82" class="shell-mid"/><stop offset="1" class="shell-dark"/></radialGradient>
<radialGradient id="cavity" cx=".45" cy=".35" r=".65"><stop stop-color="#f2f3f1"/><stop offset=".7" stop-color="#dee0dd"/><stop offset="1" stop-color="#b8bdb8"/></radialGradient>
<linearGradient id="blade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fafbf9"/><stop offset=".5" stop-color="#e7eae5"/><stop offset="1" stop-color="#c4cac3"/></linearGradient>
<radialGradient id="hub" cx=".35" cy=".25" r=".8"><stop stop-color="#fff"/><stop offset=".65" class="shell-light"/><stop offset="1" class="shell-dark"/></radialGradient>
<filter id="soft"><feGaussianBlur stdDeviation="1.1"/></filter><clipPath id="inner"><circle cx="150" cy="127" r="93"/></clipPath>
</defs>
<g class="object">
<path d="M123 209 Q121 203 150 204 Q177 202 177 212 L174 338 Q174 354 150 357 Q126 355 126 341Z" fill="url(#handle)" stroke="#bcc2be" stroke-opacity=".34" stroke-width=".7"/>
<path d="M128 339 Q150 347 173 338" fill="none" stroke="#b7beb9" stroke-opacity=".3"/>
<rect x="143" y="254" width="14" height="32" rx="7" fill="#c3c9c5" opacity=".23"/><rect x="144" y="254" width="12" height="30" rx="6" fill="url(#rim)" stroke="#c5cac6" stroke-width=".6"/>
<circle cx="150" cy="299" r="1.5" fill="#afb7b1"/><path d="M140 328h20" stroke="#b2bab4" stroke-width=".6" opacity=".55"/>
<ellipse cx="153" cy="130" rx="108" ry="109" fill="var(--shell-dark)"/>
<circle cx="150" cy="127" r="108" fill="url(#rim)" stroke="#d7dbd7" stroke-width=".7"/>
<circle cx="150" cy="127" r="97" fill="url(#cavity)" stroke="#c9cfc9" stroke-width="1.2"/>
<g clip-path="url(#inner)"><g class="rotor" id="rotor">
<path id="blade-shape" d="M149 125 C128 106 106 79 116 55 C121 41 145 40 164 48 C188 60 186 85 165 116 Q158 129 149 125Z" fill="url(#blade)" stroke="#c6ccc4" stroke-width=".55"/>
<use href="#blade-shape" transform="rotate(120 150 127)"/><use href="#blade-shape" transform="rotate(240 150 127)"/>
</g></g>
<g id="grille" fill="none"></g>
<circle cx="150" cy="127" r="96" fill="none" stroke="#fff" stroke-opacity=".88" stroke-width="2.2"/>
<circle cx="150" cy="127" r="71" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.3"/>
<circle cx="150" cy="127" r="44" fill="none" stroke="#f9faf7" stroke-opacity=".65" stroke-width="1"/>
<circle cx="151" cy="129" r="24" fill="#b3bcb3" opacity=".24" filter="url(#soft)"/><circle cx="150" cy="127" r="23" fill="url(#hub)" stroke="#d7dcd6" stroke-width=".6"/>
<path d="M144 127h12" stroke="#c0c6c0" stroke-width=".8" stroke-linecap="round"/>
<path d="M71 62 A104 104 0 0 1 222 52" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".9"/>
</g></svg></div>
<div class="primary-actions" role="group" aria-label="타이머 전원 및 초기화">
<button class="power" id="power" aria-label="타이머 시작" aria-pressed="false" title="시작 / 일시정지"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M12 3v8M7.1 5.8a8 8 0 1 0 9.8 0"/></svg></button>
<button class="reset" id="reset" tabindex="-1" aria-hidden="true" inert aria-label="타이머 초기화" title="타이머 초기화"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9a8 8 0 1 1 0 6M4 4v5h5"/></svg></button>
</div>
<div class="readout"><div class="clock-wrap" aria-hidden="true" id="clock-wrap"><div class="clock" id="clock" role="timer" aria-label="측정 시간" aria-live="off"><span id="clock-main">00:00</span><span class="clock-fraction" id="clock-fraction">.00</span></div><div class="status" id="status">TIME, WITH A LITTLE AIR.</div></div>
<div class="controls" id="controls" inert><div class="wind" role="group" aria-label="바람 세기"><button class="step" id="less" aria-label="바람 세기 줄이기" disabled>−</button><span class="strength" id="strength" aria-live="polite">약풍</span><button class="step" id="more" aria-label="바람 세기 늘리기">+</button></div><span class="divider"></span><div class="colors" role="group" aria-label="선풍기 색상"><button class="swatch" style="--chip:#f4f4ef" data-color="white" aria-label="화이트" aria-pressed="true"></button><button class="swatch" style="--chip:#bfc8bf" data-color="sage" aria-label="세이지" aria-pressed="false"></button><button class="swatch" style="--chip:#d2c3b2" data-color="sand" aria-label="샌드" aria-pressed="false"></button><button class="swatch" style="--chip:#495663" data-color="navy" aria-label="네이비" aria-pressed="false"></button></div></div>
<div class="quiet-note">바람은 마음으로 느껴주세요.</div></div>
<span class="sr-only" aria-live="polite" id="announcement"></span>
</section></main>
<script>
const root=document.querySelector('.installation'), power=document.querySelector('#power'), clock=document.querySelector('#clock'), controls=document.querySelector('#controls'), statusText=document.querySelector('#status'), reset=document.querySelector('#reset');
const grille=document.querySelector('#grille');
for(let i=0;i<76;i++){const a=i*Math.PI*2/76,b=a+.055;const x1=150+24*Math.cos(a),y1=127+24*Math.sin(a),x2=150+95*Math.cos(b),y2=127+95*Math.sin(b);const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',`M${x1} ${y1}Q${150+61*Math.cos(a+.095)} ${127+61*Math.sin(a+.095)} ${x2} ${y2}`);p.setAttribute('stroke',i<38?'#f9faf7':'#f1f3ee');p.setAttribute('stroke-width','1.1');p.setAttribute('stroke-opacity','.9');grille.appendChild(p)}
let running=false,started=false,elapsed=0,startAt=0,level=1,angle=0,velocity=0,lastFrame=performance.now();
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function timeValue(){return elapsed+(running?Date.now()-startAt:0)}
const clockMain=document.querySelector('#clock-main'),clockFraction=document.querySelector('#clock-fraction');
function formatTime(milliseconds){const ms=Math.max(0,Math.floor(milliseconds)),t=Math.floor(ms/1000),s=String(t%60).padStart(2,'0'),m=String(Math.floor(t/60)%60).padStart(2,'0'),h=Math.floor(t/3600);return {main:h?`${String(h).padStart(2,'0')}:${m}:${s}`:`${m}:${s}`,fraction:h?'':`.${String(Math.floor(ms%1000/10)).padStart(2,'0')}`,long:h>0}}
function paintTime(){const parts=formatTime(timeValue());if(clockMain.textContent!==parts.main)clockMain.textContent=parts.main;if(clockFraction.textContent!==parts.fraction)clockFraction.textContent=parts.fraction;clockFraction.hidden=parts.long;}
function sync(){root.classList.toggle('started',started);root.classList.toggle('running',running);root.classList.toggle('paused',started&&!running);power.setAttribute('aria-pressed',String(running));power.setAttribute('aria-label',running?'타이머 일시정지':started?'타이머 이어서 시작':'타이머 시작');controls.inert=!running;reset.tabIndex=started&&!running?0:-1;reset.inert=!(started&&!running);reset.setAttribute('aria-hidden',String(!(started&&!running)));document.querySelector('#clock-wrap').setAttribute('aria-hidden',String(!started));statusText.textContent=running?'TIME, WITH A LITTLE AIR.':'잠시 쉬어가는 중';paintTime()}
power.addEventListener('click',()=>{if(running){elapsed+=Date.now()-startAt;running=false}else{startAt=Date.now();running=true;started=true}sync();document.querySelector('#announcement').textContent=running?'시간 측정을 시작합니다.':'시간 측정을 일시정지했습니다.'});
reset.addEventListener('click',()=>{running=false;started=false;elapsed=0;level=1;setLevel();sync();power.focus()});
function setLevel(){root.dataset.level=level;document.querySelector('#strength').textContent=['약풍','중풍','강풍','태풍'][level-1];document.querySelector('#less').disabled=level===1;document.querySelector('#more').disabled=level===4}
document.querySelector('#less').onclick=()=>{level=Math.max(1,level-1);setLevel()};document.querySelector('#more').onclick=()=>{level=Math.min(4,level+1);setLevel()};
const palette={white:['#f8f8f5','#d4d5d2','#eeefeb'],sage:['#d3dbcf','#8c9b8a','#b9c5b4'],sand:['#e1d7c8','#ae9a80','#cbbba4'],navy:['#6e7c89','#283745','#465663']};
function color(name){if(!palette[name])return;['--shell','--shell-dark','--shell-mid'].forEach((key,i)=>document.documentElement.style.setProperty(key,palette[name][i]));document.querySelectorAll('.swatch').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.color===name)));document.querySelector('.sculpture').setAttribute('aria-label',`${document.querySelector(`[data-color="${name}"]`).getAttribute('aria-label')} 휴대용 선풍기 3D 스타일 오브제`);try{localStorage.setItem('still-air-color',name)}catch{}}
document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>color(b.dataset.color));try{color(localStorage.getItem('still-air-color')||'white')}catch{}
function frame(now){const dt=Math.min((now-lastFrame)/1000,.1);lastFrame=now;const target=running?[95,340,760,1400][level-1]:0;velocity+=(target-velocity)*(1-Math.exp(-dt*2.6));angle=(angle+velocity*dt)%360;document.querySelector('#rotor').style.transform=`rotate(${reduced.matches?0:angle}deg)`;if(running)paintTime();requestAnimationFrame(frame)}requestAnimationFrame(frame);document.addEventListener('visibilitychange',paintTime);
</script>
</body></html>
